<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA Empresarial · Desempeño de Clientes</title><style>
:root{--navy:#0b1f33;--blue:#2563eb;--green:#169447;--red:#d82c3f;--amber:#d97706;--cyan:#0284c7;--bg:#f3f6fa;--card:#fff;--muted:#667085;--border:#dfe5ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:#17202a}.top{background:linear-gradient(115deg,#071b2f,#123e65);color:#fff;padding:18px 24px;position:sticky;top:0;z-index:9;box-shadow:0 3px 16px #0003}.brand{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand h1{font-size:20px;margin:0}.brand .sub{font-size:12px;opacity:.8;margin-top:4px}.nav{display:flex;gap:7px;overflow:auto;margin-top:15px}.nav button{border:0;background:#ffffff14;color:#fff;padding:8px 11px;border-radius:8px;white-space:nowrap;cursor:pointer}.nav button.active{background:#fff;color:var(--navy)}.wrap{max-width:1550px;margin:auto;padding:18px}.filters,.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 8px #0b1f3310}.filters{padding:14px;display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:9px;margin-bottom:14px}.filters select,.filters input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px;background:#fff}.filters button{border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px;min-height:88px}.kpi b{font-size:20px;display:block;margin-top:7px}.kpi small{color:var(--muted)}.section{display:none}.section.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:15px;margin-bottom:14px;overflow:auto}.card h2{font-size:14px;margin:0 0 12px;color:var(--navy)}table{border-collapse:collapse;width:100%;font-size:12px}th{background:#eef3f8;color:#334155;text-align:left;position:sticky;top:0}th,td{padding:8px;border-bottom:1px solid #edf0f4;white-space:nowrap}.barrow{display:grid;grid-template-columns:minmax(170px,1fr) 3fr 100px 100px 100px;gap:8px;align-items:center;margin:7px 0;font-size:12px}.bar{height:10px;background:#e8edf3;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:10px}.sem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sem .s{padding:15px;border-radius:12px;color:#fff;cursor:pointer}.red{background:var(--red)}.yellow{background:var(--amber)}.green{background:var(--green)}.blue{background:var(--cyan)}.sem b{font-size:27px;display:block}.tag{padding:3px 7px;border-radius:20px;font-size:10px;font-weight:700;color:#fff}.tag.ROJO{background:var(--red)}.tag.AMARILLO{background:var(--amber)}.tag.VERDE{background:var(--green)}.tag.AZUL{background:var(--cyan)}.tag.SIN{background:#64748b}.note{background:#eff6ff;border-left:4px solid var(--blue);padding:10px;border-radius:8px;font-size:12px;margin-bottom:14px}.tools{display:flex;gap:8px;margin-bottom:9px}.tools input,.tools select{padding:8px;border:1px solid var(--border);border-radius:7px}.tools button{padding:8px 10px;border:0;border-radius:7px;background:var(--blue);color:#fff;cursor:pointer}.profile{font-size:13px;line-height:1.7}.bad{color:var(--red)}.good{color:var(--green)}@media(max-width:1050px){.filters{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.grid3{grid-template-columns:1fr}}@media(max-width:650px){.filters,.kpis{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:1fr 2fr 85px}}
</style></head><body><div class="top"><div class="brand"><div><h1>IA EMPRESARIAL · DESEMPEÑO Y SEGUIMIENTO DE CLIENTES</h1><div class="sub" id="subtitle"></div></div><div>BUSINESS INTELLIGENCE · R8</div></div><div class="nav" id="nav"></div></div><div class="wrap"><div class="filters"><select id="fz"></select><select id="fs"></select><select id="fcat"></select><select id="fp"></select><select id="fcid"></select><input id="q" placeholder="Buscar cliente"><button onclick="clearFilters()">Limpiar filtros</button></div><div class="note" id="note"></div><div id="content"></div></div><script>const DATA={"tx":[],"meta":{}}; const REQUESTED=[];
const $=id=>document.getElementById(id),num=v=>Number(v)||0,fmt=(v,d=2)=>Number(v||0).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d}),pct=(a,b)=>b?100*a/b:null,pctf=v=>v==null?'N/A':fmt(v,2)+'%',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const tabs=[['resumen','Resumen'],['productos','Productos'],['vendedores','Vendedores'],['zonas','Zonas'],['clientes','Clientes'],['seguimiento','Seguimiento'],['perdidos','Clientes perdidos'],['oportunidades','Oportunidades'],['detalle','Detalle general']];let active='resumen',semFilter='';
function uniq(k){return [...new Set(DATA.tx.map(x=>x[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'es'))}function fill(id,k,label){$(id).innerHTML='<option value="">'+label+'</option>'+uniq(k).map(x=>`<option>${esc(x)}</option>`).join('')}
function filtered(){let z=$('fz').value,s=$('fs').value,cat=$('fcat').value,p=$('fp').value,cid=$('fcid').value,q=$('q').value.trim().toLowerCase();return DATA.tx.filter(x=>(!z||x.z===z)&&(!s||x.s===s)&&(!cat||x.cat===cat)&&(!p||x.p===p)&&(!cid||x.cid===cid)&&(!q||String(x.c).toLowerCase().includes(q)||String(x.cid).toLowerCase().includes(q)))}
function clients(rows=filtered()){let m=new Map;for(let x of rows){let k=x.cid||x.c;if(!m.has(k))m.set(k,{cid:x.cid,c:x.c,z:x.z,s:x.s,cat:x.cat,a:0,b:0,prev:0,prod:new Set});let r=m.get(k);r.a+=num(x.a);r.b+=num(x.b);r.prev+=num(x.prev);if(x.p)r.prod.add(x.p)}return [...m.values()].map(r=>{r.cp=pct(r.a,r.b);r.varp=pct(r.a-r.prev,r.prev);r.dp=r.a-r.b;r.dv=r.a-r.prev;r.pending=Math.max(0,Math.max(r.b,r.prev)-r.a);r.state=((r.prev>0&&r.a<=0)||(r.b>0&&r.a<=0))?'ROJO':(r.a>0&&r.prev<=0)?'AZUL':(r.a>0&&r.b>0&&r.a/r.b<.8)?'AMARILLO':(r.b>0&&r.a/r.b>=1)?'VERDE':'SIN CLASIFICAR';return r})}
function kpis(){let c=clients(),a=c.reduce((s,x)=>s+x.a,0),b=c.reduce((s,x)=>s+x.b,0),p=c.reduce((s,x)=>s+x.prev,0),prev=c.filter(x=>x.prev>0).length,ret=c.filter(x=>x.a>0&&x.prev>0).length,lost=c.filter(x=>x.a<=0&&x.prev>0).length,rec=c.filter(x=>x.a>0&&x.prev<=0).length,bc=c.filter(x=>x.b>0).length,bv=c.filter(x=>x.b>0&&x.a>0).length;return {a,b,p,cp:pct(a,b),dp:a-b,dv:a-p,varp:pct(a-p,p),active:c.filter(x=>x.a>0).length,prev,ret,lost,rec,bc,bv,b0:c.filter(x=>x.b>0&&x.a<=0).length,retp:pct(ret,prev),lostp:pct(lost,prev),cover:pct(bv,bc),pending:c.reduce((s,x)=>s+Math.max(0,x.b-x.a),0)}}
function aggregate(k){let m=new Map;for(let x of filtered()){let key=x[k]||'SIN DATO';if(!m.has(key))m.set(key,{name:key,a:0,b:0,p:0});let r=m.get(key);r.a+=num(x.a);r.b+=num(x.b);r.p+=num(x.prev)}return [...m.values()].map(x=>({...x,cp:pct(x.a,x.b),varp:pct(x.a-x.p,x.p)})).sort((a,b)=>b.a-a.a)}
function setDim(k,v){let id={p:'fp',s:'fs',z:'fz',cat:'fcat'}[k];if(id&&$(id)){$(id).value=v;render()}}function barRows(arr,k=''){let mx=Math.max(1,...arr.map(x=>Math.max(x.a,x.b,x.p)));return arr.map(x=>`<div class="barrow"><b title="${esc(x.name)}" data-dim="${k}" data-val="${esc(x.name)}" style="${k?'cursor:pointer':''}">${esc(x.name)}</b><div class="bar"><div class="fill" style="width:${100*x.a/mx}%"></div></div><span>${fmt(x.a)} T</span><span>${pctf(x.cp)}</span><span>${fmt(x.p)} T ant.</span></div>`).join('')||'<p>Sin datos.</p>'}
function tag(s){return `<span class="tag ${s==='SIN CLASIFICAR'?'SIN':s}">${esc(s)}</span>`}function trClients(arr){return arr.map(x=>`<tr onclick="showProfile('${String(x.cid||'').replace(/'/g,"\\'")}')"><td>${tag(x.state)}</td><td>${esc(x.cid)}</td><td>${esc(x.c)}</td><td>${esc(x.z)}</td><td>${esc(x.s)}</td><td>${fmt(x.a)}</td><td>${fmt(x.b)}</td><td>${fmt(x.prev)}</td><td>${pctf(x.cp)}</td><td class="${x.dv<0?'bad':'good'}">${fmt(x.dv)}</td></tr>`).join('')}
function tableClients(arr){return `<table><thead><tr><th>Estado</th><th>Código</th><th>Cliente</th><th>Zona</th><th>Vendedor</th><th>Actual T</th><th>Presupuesto T</th><th>Anterior T</th><th>Cumpl.</th><th>Var. T</th></tr></thead><tbody>${trClients(arr)}</tbody></table>`}
function sem(){let c=clients(),counts={ROJO:0,AZUL:0,AMARILLO:0,VERDE:0};c.forEach(x=>{if(counts[x.state]!=null)counts[x.state]++});return `<div class="sem"><div class="s red" onclick="semFilter='ROJO';render()"><small>ATENCIÓN INMEDIATA</small><b>${counts.ROJO}</b>ROJO</div><div class="s blue" onclick="semFilter='AZUL';render()"><small>NUEVO / RECUPERADO</small><b>${counts.AZUL}</b>AZUL</div><div class="s yellow" onclick="semFilter='AMARILLO';render()"><small>SEGUIMIENTO</small><b>${counts.AMARILLO}</b>AMARILLO</div><div class="s green" onclick="semFilter='VERDE';render()"><small>BUEN DESEMPEÑO</small><b>${counts.VERDE}</b>VERDE</div></div>`}
function kpiCards(){let k=kpis(),vals=[['Toneladas actuales',fmt(k.a)+' T'],['Presupuesto',fmt(k.b)+' T'],['Periodo anterior',fmt(k.p)+' T'],['Cumplimiento',pctf(k.cp)],['Dif. presupuesto',fmt(k.dp)+' T'],['Variación anterior',pctf(k.varp)],['Pendiente presupuesto',fmt(k.pending)+' T'],['Clientes activos',k.active],['Clientes perdidos',k.lost],['Nuevos/recuperados',k.rec],['Presupuesto sin venta',k.b0],['Tasa retención',pctf(k.retp)],['Tasa pérdida',pctf(k.lostp)],['Cobertura presupuesto',pctf(k.cover)]];return `<div class="kpis">${vals.map(v=>`<div class="kpi"><small>${v[0]}</small><b>${v[1]}</b></div>`).join('')}</div>`}
function summary(){let k=kpis(),c=clients();return kpiCards()+`<div class="card"><h2>SEMÁFORO DE CARTERA</h2>${sem()}</div><div class="grid2"><div class="card"><h2>DESEMPEÑO POR PRODUCTO</h2>${barRows(aggregate('p').slice(0,30),'p')}</div><div class="card"><h2>DESEMPEÑO POR VENDEDOR</h2>${barRows(aggregate('s'),'s')}</div></div><div class="grid2"><div class="card"><h2>ANÁLISIS POR ZONA</h2>${barRows(aggregate('z'),'z')}</div><div class="card"><h2>ANÁLISIS POR CATEGORÍA</h2>${barRows(aggregate('cat'),'cat')}</div></div><div class="card"><h2>TOP 20 CLIENTES</h2>${tableClients(c.sort((a,b)=>b.a-a.a).slice(0,20))}</div><div class="note">Resumen dinámico: ${fmt(k.a)} T actuales frente a ${fmt(k.b)} T presupuestadas (${pctf(k.cp)}). Hay ${k.lost} clientes perdidos, ${k.rec} nuevos/recuperados y ${k.b0} con presupuesto sin venta. Volumen pendiente: ${fmt(k.pending)} T.</div>`}
function ranking(k,title){return `<div class="card"><h2>${title}</h2>${barRows(aggregate(k),k)}</div>`}function lost(){let c=clients().filter(x=>x.a<=0&&x.prev>0).sort((a,b)=>b.prev-a.prev);return `<div class="card"><h2>CLIENTES PERDIDOS · ${c.length}</h2>${tableClients(c)}</div>`}function opportunities(){let c=clients().filter(x=>x.pending>0||x.dv<0).sort((a,b)=>b.pending-a.pending);return `<div class="card"><h2>OPORTUNIDADES PRIORITARIAS</h2>${tableClients(c.slice(0,100))}</div>`}
function followup(){let c=clients(),b0=c.filter(x=>x.b>0&&x.a<=0).sort((a,b)=>b.b-a.b),low=c.filter(x=>x.a>0&&x.b>0&&x.cp<80).sort((a,b)=>b.pending-a.pending),rec=c.filter(x=>x.a>0&&x.prev<=0).sort((a,b)=>b.a-a.a),dec=c.filter(x=>x.prev>0&&x.a<x.prev).sort((a,b)=>a.dv-b.dv),grow=c.filter(x=>x.a>x.prev).sort((a,b)=>b.dv-a.dv);return `<div class="card"><h2>PRESUPUESTO SIN VENTA</h2>${tableClients(b0)}</div><div class="card"><h2>CLIENTES CON BAJO CUMPLIMIENTO</h2>${tableClients(low)}</div><div class="card"><h2>CLIENTES NUEVOS O RECUPERADOS</h2>${tableClients(rec)}</div><div class="grid2"><div class="card"><h2>MAYORES CAÍDAS</h2>${tableClients(dec.slice(0,20))}</div><div class="card"><h2>MAYORES CRECIMIENTOS</h2>${tableClients(grow.slice(0,20))}</div></div>`}
function clientsView(){let c=clients();if(semFilter)c=c.filter(x=>x.state===semFilter);return `<div class="tools"><button onclick="semFilter='';render()">Todos los estados</button><button onclick="csvClients()">Exportar filtrados CSV</button></div><div class="card"><h2>CLIENTES · ${c.length}</h2>${tableClients(c.sort((a,b)=>b.a-a.a))}</div><div id="profile"></div>`}
function detail(){let r=filtered();return `<div class="card"><h2>DETALLE GENERAL · ${r.length} registros</h2><table><thead><tr><th>Línea</th><th>Código</th><th>Cliente</th><th>Artículo</th><th>Categoría</th><th>Zona</th><th>Vendedor</th><th>Actual</th><th>Presupuesto</th><th>Anterior</th><th>Inicio</th><th>Fin</th></tr></thead><tbody>${r.slice(0,5000).map(x=>`<tr><td>${esc(x.line)}</td><td>${esc(x.cid)}</td><td>${esc(x.c)}</td><td>${esc(x.p)}</td><td>${esc(x.cat)}</td><td>${esc(x.z)}</td><td>${esc(x.s)}</td><td>${fmt(x.a)}</td><td>${fmt(x.b)}</td><td>${fmt(x.prev)}</td><td>${esc(x.fi)}</td><td>${esc(x.ff)}</td></tr>`).join('')}</tbody></table></div>`}
function showProfile(cid){let x=clients().find(x=>String(x.cid)===String(cid));if(!x)return;let text=x.state==='ROJO'?`Cliente en riesgo: anteriormente registró ${fmt(x.prev)} T, actualmente ${fmt(x.a)} T y tiene ${fmt(x.b)} T presupuestadas. Seguimiento comercial prioritario.`:`Cliente ${x.state.toLowerCase()}: actual ${fmt(x.a)} T, presupuesto ${fmt(x.b)} T y anterior ${fmt(x.prev)} T.`;$('profile').innerHTML=`<div class="card profile"><h2>FICHA DEL CLIENTE</h2><b>${esc(x.cid)} · ${esc(x.c)}</b><br>Zona: ${esc(x.z)} · Vendedor: ${esc(x.s)} · Categoría: ${esc(x.cat)}<br>Productos: ${esc([...x.prod].join(' | '))}<br>Actual: ${fmt(x.a)} T · Presupuesto: ${fmt(x.b)} T · Anterior: ${fmt(x.prev)} T · Cumplimiento: ${pctf(x.cp)}<hr>${esc(text)}</div>`;$('profile').scrollIntoView({behavior:'smooth'})}
function csvClients(){let rows=clients(),heads=['Estado','Cod_Cliente','Cliente','Zona','Vendedor','Actual','Presupuesto','Anterior','Cumplimiento_%','Variacion_%'];let txt='\ufeff'+heads.join(',')+'\r\n'+rows.map(x=>[x.state,x.cid,x.c,x.z,x.s,x.a,x.b,x.prev,x.cp,x.varp].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let b=new Blob([txt],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='clientes_filtrados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===active));let html=active==='resumen'?summary():active==='productos'?ranking('p','DESEMPEÑO POR PRODUCTO · ACTUAL / PRESUPUESTO / ANTERIOR'):active==='vendedores'?ranking('s','DESEMPEÑO POR VENDEDOR'):active==='zonas'?ranking('z','ANÁLISIS POR ZONA'):active==='clientes'?clientsView():active==='seguimiento'?followup():active==='perdidos'?lost():active==='oportunidades'?opportunities():detail();$('content').innerHTML=html;$('content').querySelectorAll('[data-dim]').forEach(el=>el.onclick=()=>setDim(el.dataset.dim,el.dataset.val))}
function clearFilters(){['fz','fs','fcat','fp','fcid'].forEach(id=>$(id).value='');$('q').value='';semFilter='';render()}function init(){ $('subtitle').textContent=(DATA.meta.file||'')+' · '+Number(DATA.meta.rows||0).toLocaleString('es-MX')+' filas · '+(DATA.meta.from||'')+' → '+(DATA.meta.to||'');$('note').textContent='Este dashboard usa Fecha_Inicial y Fecha_Final como periodo cubierto del reporte; no inventa una tendencia mensual.';fill('fz','z','Todas las zonas');fill('fs','s','Todos los vendedores');fill('fcat','cat','Todas las categorías');fill('fp','p','Todos los artículos');fill('fcid','cid','Todos los clientes');$('nav').innerHTML=tabs.map(t=>`<button data-id="${t[0]}">${t[1]}</button>`).join('');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()});['fz','fs','fcat','fp','fcid'].forEach(id=>$(id).onchange=render);$('q').oninput=render;render()}init();
</script></body></html>
