<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA Empresarial · Dashboard adaptable</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#f4f7fb;color:#17202a}.h{background:#0b1f33;color:white;padding:22px}.w{max-width:1400px;margin:auto;padding:18px}.c{background:#fff;border:1px solid #dde3ea;border-radius:13px;padding:16px;margin-bottom:14px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #edf0f4;text-align:left}th{background:#eef3f8}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k div{background:white;border:1px solid #dde3ea;border-radius:12px;padding:14px}input{padding:9px;width:min(500px,100%);border:1px solid #ccd5df;border-radius:8px}@media(max-width:700px){.k{grid-template-columns:1fr 1fr}}</style></head><body><div class="h"><b>IA EMPRESARIAL · DASHBOARD ADAPTABLE</b><div id="sub"></div></div><div class="w"><div class="c"><input id="q" placeholder="Buscar en los registros"></div><div class="k" id="kp"></div><div class="c"><h3>Datos disponibles</h3><div id="t"></div></div></div><script>const DATA={"rows":[],"meta":{}}; const REQUESTED=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){let q=$('q').value.toLowerCase(),r=DATA.rows.filter(x=>!q||Object.values(x).some(v=>String(v??'').toLowerCase().includes(q))),cols=DATA.meta.columns||[];$('kp').innerHTML=`<div>Filas<b style="display:block;font-size:22px">${r.length.toLocaleString('es-MX')}</b></div><div>Columnas<b style="display:block;font-size:22px">${cols.length}</b></div><div>Hoja<b style="display:block;font-size:18px">${esc(DATA.meta.sheet||'')}</b></div><div>Tipo<b style="display:block;font-size:18px">Genérico</b></div>`;$('t').innerHTML='<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+r.slice(0,5000).map(x=>'<tr>'+cols.map(c=>'<td>'+esc(x[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}$('sub').textContent=(DATA.meta.file||'')+' · '+(DATA.meta.prompt||'');$('q').oninput=render;render();</script></body></html>
